[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobboard-worker"
version = "0.1.0"
description = "Worker locale: ingest annunci, matching, generazione CV, candidature"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- database ---
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",

    # --- config e validazione ---
    "pydantic>=2.10",
    "pydantic-settings>=2.7",

    # --- rete ---
    "httpx>=0.28",
    "tenacity>=9.0",

    # --- scheduling ---
    "apscheduler>=3.11,<4",

    # --- AI ---
    # Provider di default: free tier, nessun costo. Il layer e' agnostico
    # (jobboard.ai.client), anthropic resta disponibile come alternativa.
    "google-genai>=1.0",
    "anthropic>=0.42",
    "fastembed>=0.5",
    "numpy>=2.1",

    # --- parsing CV e job description ---
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "py3langid>=0.3",

    # --- matching ---
    "rapidfuzz>=3.11",

    # --- generazione CV ---
    "jinja2>=3.1",
    "playwright>=1.49",

    # --- storage ---
    "storage3>=0.10",

    # --- CLI e logging ---
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-beautifulsoup4",
]

[project.scripts]
jobboard = "jobboard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["jobboard"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Le migration sono generate da Alembic e sono un registro storico: riformattarle
# creerebbe solo rumore nei diff, e i loro `typing.Union` vengono dal template.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # Depends()/Typer usano chiamate nei default

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "storage3.*", "pypdfium2.*", "pdfplumber.*", "py3langid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
